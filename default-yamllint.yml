# Default lint profile: catches mis-nested keys and enforces expanded block style, so a
# structural mistake is visible to the eye (e.g. `elements` as a sibling of `list`
# instead of nested under it — which silently yields an empty generator).
extends: default

rules:
  line-length: disable
  document-start: disable
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    forbid: true        # no inline {} — block style only
  brackets:
    forbid: false       # [] tolerated (some upstream values need it)
  truthy:
    check-keys: false
