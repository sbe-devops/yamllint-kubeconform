apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: good-example
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: te-non-sbe
            app: good-example
  template:
    metadata:
      name: '{{app}}-{{cluster}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/example/gitops.git
        targetRevision: HEAD
        path: '{{app}}/{{cluster}}'
      destination:
        name: '{{cluster}}'
        namespace: default
